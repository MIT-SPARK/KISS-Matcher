kiss_matcher_sam:
  ros__parameters:
    map_frame: "map"
    base_frame: "base"
    loop_pub_hz: 0.1
    loop_update_hz: 2.0
    loop_pub_delayed_time: 30.0
    vis_hz: 1.0

    keyframe:
      keyframe_threshold: 1.5
      num_submap_keyframes: 10
      enable_submap_matching: true

    loop:
      loop_detection_radius: 20.0
      loop_detection_timediff_threshold: 90.0

    quatro_nano_gicp_voxel_resolution: 0.3
    save_voxel_resolution: 0.3

    local_reg:
      num_threads: 8
      correspondences_number: 20
      max_iter: 32
      icp_score_threshold: 2.0

    global_reg:
      enable: true
      optimize_matching: true
      distance_threshold: 35.0
      max_nucorrespondences: 500

    result:
      save_map_pcd: true
      save_map_bag: true
      save_in_kitti_format: true
      seq_name: "sequence"
